<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="ModeStore - Boutique de vêtements seconde main au Maroc">
  <title>ModeStore | Seconde Main</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #f7f7f7;
      --white: #ffffff;
      --black: #111111;
      --grey: #777777;
      --line: #e8e8e8;
      --radius: 14px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--black);
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .wrap {
      width: min(1180px, 92%);
      margin: auto;
    }

    .top {
      background: white;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .nav {
      min-height: 75px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 29px;
      font-weight: 900;
      letter-spacing: 3px;
    }

    .navlinks {
      display: flex;
      gap: 25px;
      font-size: 14px;
    }

    .navbtn, .btn {
      border: 1px solid var(--black);
      background: var(--black);
      color: white;
      padding: 12px 18px;
      border-radius: 7px;
    }

    .navbtn {
      background: white;
      color: black;
    }

    .hero {
      margin: 35px 0;
      padding: 65px 7%;
      background: white;
      border-radius: var(--radius);
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      align-items: center;
      gap: 30px;
    }

    .hero h1 {
      font-size: clamp(35px, 5vw, 60px);
      line-height: 1.08;
      margin: 15px 0;
    }

    .hero p {
      color: var(--grey);
      line-height: 1.8;
      margin-bottom: 25px;
      max-width: 520px;
    }

    .hero-art {
      min-height: 270px;
      background: #eeeeee;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 35px;
      font-weight: 900;
      letter-spacing: 4px;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin: 35px 0;
    }

    .cat {
      background: white;
      border: 1px solid var(--line);
      padding: 22px 12px;
      border-radius: 10px;
      text-align: left;
    }

    .cat b, .cat small {
      display: block;
    }

    .cat small {
      color: var(--grey);
      margin-top: 7px;
    }

    .cat.active {
      border-color: black;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 45px 0 20px;
    }

    .section-head h2 {
      font-size: 30px;
      margin: 8px 0;
    }

    .eyebrow {
      color: var(--grey);
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .tools {
      display: flex;
      gap: 10px;
      margin-bottom: 22px;
    }

    .tools input, .tools select,
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: white;
      color: black;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .product {
      background: white;
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }

    .photo {
      height: 260px;
      background: #eeeeee;
      position: relative;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .tag {
      position: absolute;
      top: 12px;
      left: 12px;
      background: white;
      padding: 7px 10px;
      border-radius: 5px;
      font-size: 11px;
    }

    .product-body {
      padding: 15px;
    }

    .product-body h3 {
      margin-bottom: 10px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 10px 0;
    }

    .pill {
      background: #f1f1f1;
      padding: 5px 8px;
      border-radius: 5px;
      font-size: 11px;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
    }

    .price {
      font-weight: 900;
      font-size: 18px;
    }

    .buy {
      border: 0;
      background: black;
      color: white;
      padding: 10px 12px;
      border-radius: 6px;
    }

    .empty {
      background: white;
      padding: 35px;
      text-align: center;
      border-radius: 10px;
      grid-column: 1 / -1;
    }

    .admin, .banner {
      background: white;
      padding: 30px;
      border-radius: var(--radius);
      margin: 45px 0;
    }

    .field {
      margin: 12px 0;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    .field textarea {
      min-height: 100px;
    }

    .hidden {
      display: none !important;
    }

    footer {
      background: #111;
      color: white;
      padding: 45px 0;
      margin-top: 50px;
    }

    .footrow {
      display: flex;
      justify-content: space-between;
      gap: 30px;
    }

    @media(max-width: 800px) {
      .navlinks {
        display: none;
      }

      .hero {
        grid-template-columns: 1fr;
        padding: 35px 22px;
      }

      .categories {
        grid-template-columns: repeat(2, 1fr);
      }

      .products {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .photo {
        height: 210px;
      }

      .tools {
        flex-direction: column;
      }

      .footrow {
        flex-direction: column;
      }
    }
  </style>
</head>
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="ModeStore - Seconde main, bon style.">
<title>ModeStore | Seconde main, bon style</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --black: #171717;
  --white: #ffffff;
  --grey: #f5f5f5;
  --muted: #777777;
  --border: #e8e8e8;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: var(--white);
  color: var(--black);
}

button, input, select, textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

a {
  color: inherit;
  text-decoration: none;
}

.container {
  width: min(1180px, 92%);
  margin: auto;
}

header {
  border-bottom: 1px solid var(--border);
  background: #fff;
  position: sticky;
  top: 0;
  z-index: 20;
}

.header-inner {
  min-height: 76px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
}

.logo {
  font-size: 27px;
  font-weight: 900;
  letter-spacing: -1.5px;
}

.logo span {
  color: #999;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.small-btn {
  border: 1px solid var(--border);
  background: white;
  padding: 10px 14px;
  border-radius: 5px;
  color: var(--black);
}

.hero {
  background: var(--grey);
  padding: 75px 20px;
  text-align: center;
}

.hero h1 {
  font-size: clamp(32px, 6vw, 58px);
  letter-spacing: -2px;
  margin-bottom: 15px;
}

.hero p {
  color: var(--muted);
  line-height: 1.7;
  max-width: 550px;
  margin: auto;
}

.section {
  padding: 55px 0;
}

.section-title {
  font-size: 25px;
  margin-bottom: 25px;
}

.categories {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

.category-btn {
  background: var(--grey);
  border: 1px solid var(--border);
  padding: 22px 10px;
  text-align: center;
  font-weight: bold;
  border-radius: 5px;
}

.category-btn:hover,
.category-btn.active {
  background: var(--black);
  color: white;
}

.products-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 22px;
}

.product-card {
  border: 1px solid var(--border);
  border-radius: 5px;
  overflow: hidden;
  background: white;
}

.product-image {
  width: 100%;
  aspect-ratio: 3 / 4;
  background: var(--grey);
  object-fit: cover;
  display: block;
}

.product-info {
  padding: 14px;
}

.product-info h3 {
  font-size: 16px;
  margin-bottom: 8px;
}

.product-price {
  font-weight: bold;
  margin: 9px 0;
}

.product-quality {
  color: var(--muted);
  font-size: 13px;
}

.buy-btn {
  width: 100%;
  border: 0;
  background: var(--black);
  color: white;
  padding: 12px;
  border-radius: 4px;
  margin-top: 10px;
}

.buy-btn:hover {
  background: #444;
}

.hidden {
  display: none !important;
}

.admin-section {
  background: var(--grey);
  padding: 45px 0;
}

.admin-panel {
  background: white;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 22px;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 7px;
  margin-bottom: 14px;
}

.field label {
  font-size: 14px;
  font-weight: bold;
}

.field input,
.field select,
.field textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 4px;
  background: white;
}

.field textarea {
  min-height: 90px;
  resize: vertical;
}

.admin-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
}

footer {
  padding: 28px 0;
  text-align: center;
  color: var(--muted);
  border-top: 1px solid var(--border);
  font-size: 13px;
}

@media (max-width: 800px) {
  .products-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .categories {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 480px) {
  .header-inner {
    min-height: 65px;
  }

  .logo {
    font-size: 22px;
  }

  .form-grid {
    grid-template-columns: 1fr;
  }

  .hero {
    padding: 55px 15px;
  }

  .section {
    padding: 38px 0;
  }
}
</style>
</head>
